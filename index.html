<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.game {
    width: 100%;
    max-width: 520px;
    background: white;
    border-radius: 25px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
}

h1 {
    margin: 0 0 8px;
    font-size: 38px;
    color: #333;
}

.subtitle {
    color: #777;
    margin-bottom: 22px;
}

/* =========================
   GAME MODE
========================= */

.modes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
}

.mode-btn {
    width: 100%;
    border: none;
    padding: 13px 10px;
    border-radius: 12px;
    cursor: pointer;
    background: #eeeeee;
    color: #333;
    font-size: 16px;
    font-weight: bold;
    transition: 0.2s;
}

.mode-btn:hover {
    transform: translateY(-2px);
}

.mode-btn.active {
    background: #667eea;
    color: white;
}

/* =========================
   DIFFICULTY
========================= */

.difficulty {
    margin-bottom: 22px;
}

.difficulty.hidden {
    display: none;
}

.difficulty-title {
    font-size: 16px;
    color: #555;
    font-weight: bold;
    margin-bottom: 10px;
}

.difficulty-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.difficulty-btn {
    width: 100%;
    border: none;
    padding: 11px 5px;
    border-radius: 10px;
    cursor: pointer;
    background: #eeeeee;
    color: #333;
    font-size: 14px;
    font-weight: bold;
    transition: 0.2s;
}

.difficulty-btn:hover {
    transform: translateY(-2px);
}

.difficulty-btn.active.easy {
    background: #16a34a;
    color: white;
}

.difficulty-btn.active.medium {
    background: #d97706;
    color: white;
}

.difficulty-btn.active.strong {
    background: #dc2626;
    color: white;
}

/* =========================
   SCOREBOARD
========================= */

.scoreboard {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
}

.score {
    background: #f5f5f5;
    border-radius: 15px;
    padding: 12px 5px;
}

.score-title {
    font-size: 15px;
    color: #666;
    margin-bottom: 5px;
}

.score-number {
    font-size: 28px;
    font-weight: bold;
    color: #333;
}

/* =========================
   STATUS
========================= */

.status {
    min-height: 45px;
    font-size: 22px;
    font-weight: bold;
    color: #444;
    margin-bottom: 15px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.status.win {
    color: #16a34a;
}

.status.loss {
    color: #dc2626;
}

.status.draw {
    color: #d97706;
}

/* =========================
   BOARD
========================= */

.board {
    width: min(90vw, 360px);
    aspect-ratio: 1;
    margin: 0 auto 25px;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.cell {
    border: none;
    border-radius: 15px;
    background: #f0f0f0;

    font-size: clamp(45px, 15vw, 75px);
    font-weight: bold;

    cursor: pointer;
    color: #333;

    transition: 0.15s;
}

.cell:hover:not(:disabled) {
    background: #e2e2e2;
    transform: scale(1.02);
}

.cell:disabled {
    cursor: default;
}

.cell.winner {
    background: #86efac;
    transform: scale(1.04);
}

/* =========================
   ACTION BUTTONS
========================= */

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.action-btn {
    border: none;
    border-radius: 12px;
    padding: 13px 10px;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.new-game {
    background: #667eea;
    color: white;
}

.reset {
    background: #eeeeee;
    color: #333;
}

.action-btn:hover {
    opacity: 0.9;
}

/* =========================
   MESSAGE
========================= */

.message {
    margin-top: 20px;
    padding: 12px;

    border-radius: 12px;
    background: #f7f7f7;

    color: #666;
    font-size: 14px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 450px) {

    .game {
        padding: 25px 15px;
    }

    h1 {
        font-size: 32px;
    }

    .mode-btn {
        font-size: 14px;
        padding: 11px 5px;
    }

    .difficulty-btn {
        font-size: 13px;
        padding: 10px 3px;
    }

    .status {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>🎮 Tic Tac Toe</h1>

    <div class="subtitle">
        Classic Tic Tac Toe Game
    </div>


    <!-- GAME MODE -->

    <div class="modes">

        <button
            id="computerMode"
            class="mode-btn active"
        >
            🤖 Computer
        </button>

        <button
            id="twoPlayerMode"
            class="mode-btn"
        >
            👥 2 Players
        </button>

    </div>


    <!-- DIFFICULTY -->

    <div
        id="difficulty"
        class="difficulty"
    >

        <div class="difficulty-title">
            🎯 Difficulty Level
        </div>

        <div class="difficulty-buttons">

            <button
                id="easyBtn"
                class="difficulty-btn easy active"
            >
                🟢 Easy
            </button>

            <button
                id="mediumBtn"
                class="difficulty-btn medium"
            >
                🟡 Medium
            </button>

            <button
                id="strongBtn"
                class="difficulty-btn strong"
            >
                🔴 Strong
            </button>

        </div>

    </div>


    <!-- SCORE -->

    <div class="scoreboard">

        <div class="score">
            <div class="score-title">
                ❌ X
            </div>

            <div
                id="xScore"
                class="score-number"
            >
                0
            </div>
        </div>


        <div class="score">
            <div class="score-title">
                🤝 Draw
            </div>

            <div
                id="drawScore"
                class="score-number"
            >
                0
            </div>
        </div>


        <div class="score">
            <div class="score-title">
                ⭕ O
            </div>

            <div
                id="oScore"
                class="score-number"
            >
                0
            </div>
        </div>

    </div>


    <!-- STATUS -->

    <div
        id="status"
        class="status"
    >
        Your turn — X
    </div>


    <!-- BOARD -->

    <div class="board">

        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>

        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>

        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>

    </div>


    <!-- ACTION BUTTONS -->

    <div class="buttons">

        <button
            id="newGame"
            class="action-btn new-game"
        >
            🔄 New Game
        </button>

        <button
            id="resetScore"
            class="action-btn reset"
        >
            🗑️ Reset Score
        </button>

    </div>


    <div class="message">
        Have fun playing Tic Tac Toe!
    </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const cells =
    document.querySelectorAll(".cell");

const statusText =
    document.getElementById("status");

const computerModeButton =
    document.getElementById("computerMode");

const twoPlayerModeButton =
    document.getElementById("twoPlayerMode");

const difficultyBox =
    document.getElementById("difficulty");

const easyBtn =
    document.getElementById("easyBtn");

const mediumBtn =
    document.getElementById("mediumBtn");

const strongBtn =
    document.getElementById("strongBtn");

const newGameButton =
    document.getElementById("newGame");

const resetScoreButton =
    document.getElementById("resetScore");

const xScoreElement =
    document.getElementById("xScore");

const oScoreElement =
    document.getElementById("oScore");

const drawScoreElement =
    document.getElementById("drawScore");


/* =========================
   VARIABLES
========================= */

let board = [
    "", "", "",
    "", "", "",
    "", "", ""
];

let currentPlayer = "X";

let gameOver = false;

let computerThinking = false;

let computerMode = true;

let difficultyLevel = "easy";

let xScore = 0;
let oScore = 0;
let drawScore = 0;


/* =========================
   WINNING LINES
========================= */

const winningCombinations = [

    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],

    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],

    [0, 4, 8],
    [2, 4, 6]

];


/* =========================
   CELL CLICK
========================= */

cells.forEach(cell => {

    cell.addEventListener("click", () => {

        const index =
            Number(cell.dataset.index);


        if (gameOver) {
            return;
        }


        if (computerThinking) {
            return;
        }


        if (board[index] !== "") {
            return;
        }


        if (
            computerMode &&
            currentPlayer !== "X"
        ) {
            return;
        }


        makeMove(
            index,
            currentPlayer
        );

    });

});


/* =========================
   MAKE MOVE
========================= */

function makeMove(index, player) {

    if (board[index] !== "") {
        return;
    }


    board[index] = player;

    cells[index].textContent = player;


    checkGame();

}


/* =========================
   CHECK GAME
========================= */

function checkGame() {

    const winningLine =
        getWinningLine();


    /* WIN */

    if (winningLine) {

        gameOver = true;

        computerThinking = false;


        highlightWinner(
            winningLine
        );


        disableCells();


        const winner =
            board[winningLine[0]];


        if (winner === "X") {

            xScore++;

            xScoreElement.textContent =
                xScore;


            if (computerMode) {

                statusText.textContent =
                    "🎉 YOU WIN!";

            } else {

                statusText.textContent =
                    "🎉 X WINS!";

            }


            statusText.className =
                "status win";

        } else {

            oScore++;

            oScoreElement.textContent =
                oScore;


            if (computerMode) {

                statusText.textContent =
                    "😔 YOU LOST!";

                statusText.className =
                    "status loss";

            } else {

                statusText.textContent =
                    "🎉 O WINS!";

                statusText.className =
                    "status win";

            }

        }


        return;

    }


    /* DRAW */

    if (!board.includes("")) {

        gameOver = true;

        computerThinking = false;


        drawScore++;

        drawScoreElement.textContent =
            drawScore;


        disableCells();


        statusText.textContent =
            "🤝 DRAW!";

        statusText.className =
            "status draw";


        return;

    }


    /* NEXT PLAYER */

    currentPlayer =
        currentPlayer === "X"
            ? "O"
            : "X";


    /* COMPUTER */

    if (computerMode) {

        if (currentPlayer === "X") {

            statusText.textContent =
                "Your turn — X";

            statusText.className =
                "status";

        } else {

            computerThinking = true;

            statusText.textContent =
                "🤖 Computer is thinking...";

            statusText.className =
                "status";


            setTimeout(() => {

                computerMove();

            }, 450);

        }


        return;

    }


    /* TWO PLAYERS */

    statusText.textContent =
        "Player " +
        currentPlayer +
        "'s turn";

    statusText.className =
        "status";

}


/* =========================
   GET WINNING LINE
========================= */

function getWinningLine() {

    for (
        const combination
        of winningCombinations
    ) {

        const a = combination[0];
        const b = combination[1];
        const c = combination[2];


        if (

            board[a] !== "" &&

            board[a] === board[b] &&

            board[a] === board[c]

        ) {

            return combination;

        }

    }


    return null;

}


/* =========================
   HIGHLIGHT WINNER
========================= */

function highlightWinner(line) {

    line.forEach(index => {

        cells[index]
            .classList
            .add("winner");

    });

}


/* =========================
   COMPUTER MOVE
========================= */

function computerMove() {

    if (gameOver) {
        computerThinking = false;
        return;
    }


    if (!computerMode) {
        computerThinking = false;
        return;
    }


    let move;


    if (difficultyLevel === "easy") {

        move = getEasyMove();

    }

    else if (
        difficultyLevel === "medium"
    ) {

        move = getMediumMove();

    }

    else {

        move = getStrongMove();

    }


    if (
        move !== null &&
        move !== undefined
    ) {

        makeMove(
            move,
            "O"
        );

    }


    computerThinking = false;

}


/* =========================
   EASY MODE
========================= */

function getEasyMove() {

    const empty =
        getEmptyCells();


    if (empty.length === 0) {
        return null;
    }


    const randomIndex =
        Math.floor(
            Math.random() *
            empty.length
        );


    return empty[randomIndex];

}


/* =========================
   MEDIUM MODE
========================= */

function getMediumMove() {

    const empty =
        getEmptyCells();


    if (empty.length === 0) {
        return null;
    }


    /* Computer WIN */

    for (const index of empty) {

        board[index] = "O";


        if (getWinningLine()) {

            board[index] = "";

            return index;

        }


        board[index] = "";

    }


    /* BLOCK PLAYER */

    for (const index of empty) {

        board[index] = "X";


        if (getWinningLine()) {

            board[index] = "";

            return index;

        }


        board[index] = "";

    }


    /* CENTER */

    if (board[4] === "") {
        return 4;
    }


    /* CORNER */

    const corners = [
        0, 2, 6, 8
    ];


    const availableCorners =
        corners.filter(
            index =>
                board[index] === ""
        );


    if (
        availableCorners.length > 0
    ) {

        return availableCorners[
            Math.floor(
                Math.random() *
                availableCorners.length
            )
        ];

    }


    /* ANY EMPTY */

    return empty[
        Math.floor(
            Math.random() *
            empty.length
        )
    ];

}


/* =========================
   STRONG MODE
========================= */

function getStrongMove() {

    const empty =
        getEmptyCells();


    if (empty.length === 0) {
        return null;
    }


    let bestScore = -Infinity;

    let bestMoves = [];


    for (const index of empty) {

        board[index] = "O";


        const score =
            minimax(
                board,
                0,
                false
            );


        board[index] = "";


        if (score > bestScore) {

            bestScore = score;

            bestMoves = [index];

        }

        else if (
            score === bestScore
        ) {

            bestMoves.push(index);

        }

    }


    /*
       If several moves are equally good,
       choose randomly.
    */

    return bestMoves[
        Math.floor(
            Math.random() *
            bestMoves.length
        )
    ];

}


/* =========================
   MINIMAX
========================= */

function minimax(
    position,
    depth,
    maximizing
) {

    const result =
        evaluatePosition(
            position
        );


    if (result !== null) {

        return result;

    }


    const empty = [];


    for (
        let i = 0;
        i < position.length;
        i++
    ) {

        if (
            position[i] === ""
        ) {

            empty.push(i);

        }

    }


    /* COMPUTER O */

    if (maximizing) {

        let bestScore =
            -Infinity;


        for (const index of empty) {

            position[index] = "O";


            const score =
                minimax(
                    position,
                    depth + 1,
                    false
                );


            position[index] = "";


            bestScore =
                Math.max(
                    bestScore,
                    score
                );

        }


        return bestScore;

    }


    /* PLAYER X */

    let bestScore =
        Infinity;


    for (const index of empty) {

        position[index] = "X";


        const score =
            minimax(
                position,
                depth + 1,
                true
            );


        position[index] = "";


        bestScore =
            Math.min(
                bestScore,
                score
            );

    }


    return bestScore;

}


/* =========================
   EVALUATE POSITION
========================= */

function evaluatePosition(position) {

    for (
        const combination
        of winningCombinations
    ) {

        const a = combination[0];
        const b = combination[1];
        const c = combination[2];


        if (

            position[a] !== "" &&

            position[a] === position[b] &&

            position[a] === position[c]

        ) {

            if (
                position[a] === "O"
            ) {

                return 10;

            }


            if (
                position[a] === "X"
            ) {

                return -10;

            }

        }

    }


    if (
        !position.includes("")
    ) {

        return 0;

    }


    return null;

}


/* =========================
   GET EMPTY CELLS
========================= */

function getEmptyCells() {

    const empty = [];


    for (
        let i = 0;
        i < board.length;
        i++
    ) {

        if (
            board[i] === ""
        ) {

            empty.push(i);

        }

    }


    return empty;

}


/* =========================
   DISABLE CELLS
========================= */

function disableCells() {

    cells.forEach(cell => {

        cell.disabled = true;

    });

}


/* =========================
   ENABLE CELLS
========================= */

function enableCells() {

    cells.forEach(cell => {

        cell.disabled = false;

    });

}


/* =========================
   NEW GAME
========================= */

function newGame() {

    board = [
        "", "", "",
        "", "", "",
        "", "", ""
    ];


    currentPlayer = "X";

    gameOver = false;

    computerThinking = false;


    cells.forEach(cell => {

        cell.textContent = "";

        cell.disabled = false;

        cell.classList.remove(
            "winner"
        );

    });


    statusText.className =
        "status";


    if (computerMode) {

        statusText.textContent =
            "Your turn — X";

    } else {

        statusText.textContent =
            "Player X's turn";

    }

}


/* =========================
   RESET SCORE
========================= */

function resetScore() {

    xScore = 0;

    oScore = 0;

    drawScore = 0;


    xScoreElement.textContent =
        "0";

    oScoreElement.textContent =
        "0";

    drawScoreElement.textContent =
        "0";


    newGame();

}


/* =========================
   COMPUTER MODE
========================= */

computerModeButton.addEventListener(
    "click",
    () => {

        computerMode = true;


        computerModeButton
            .classList
            .add("active");


        twoPlayerModeButton
            .classList
            .remove("active");


        difficultyBox
            .classList
            .remove("hidden");


        newGame();

    }
);


/* =========================
   2 PLAYER MODE
========================= */

twoPlayerModeButton.addEventListener(
    "click",
    () => {

        computerMode = false;


        twoPlayerModeButton
            .classList
            .add("active");


        computerModeButton
            .classList
            .remove("active");


        difficultyBox
            .classList
            .add("hidden");


        newGame();

    }
);


/* =========================
   EASY
========================= */

easyBtn.addEventListener(
    "click",
    () => {

        difficultyLevel = "easy";


        easyBtn
            .classList
            .add("active");


        mediumBtn
            .classList
            .remove("active");


        strongBtn
            .classList
            .remove("active");


        newGame();

    }
);


/* =========================
   MEDIUM
========================= */

mediumBtn.addEventListener(
    "click",
    () => {

        difficultyLevel = "medium";


        mediumBtn
            .classList
            .add("active");


        easyBtn
            .classList
            .remove("active");


        strongBtn
            .classList
            .remove("active");


        newGame();

    }
);


/* =========================
   STRONG
========================= */

strongBtn.addEventListener(
    "click",
    () => {

        difficultyLevel = "strong";


        strongBtn
            .classList
            .add("active");


        easyBtn
            .classList
            .remove("active");


        mediumBtn
            .classList
            .remove("active");


        newGame();

    }
);


/* =========================
   NEW GAME
========================= */

newGameButton.addEventListener(
    "click",
    newGame
);


/* =========================
   RESET SCORE
========================= */

resetScoreButton.addEventListener(
    "click",
    resetScore
);


/* =========================
   START GAME
========================= */

newGame();

</script>

</body>
</html>
