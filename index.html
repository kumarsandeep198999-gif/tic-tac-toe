<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6c5ce7">
<title>Sandeep Kumar | Tic Tac Toe</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#6c5ce7 100%);
}

.game{
    width:100%;
    max-width:520px;
    padding:28px;
    border-radius:28px;
    background:rgba(255,255,255,.96);
    box-shadow:0 25px 60px rgba(0,0,0,.25);
    text-align:center;
}

.brand{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.logo{
    width:48px;
    height:48px;
    border-radius:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:19px;
    font-weight:bold;
    background:linear-gradient(135deg,#6c5ce7,#a855f7);
    box-shadow:0 8px 20px rgba(108,92,231,.35);
}

.brand-name{
    font-size:20px;
    font-weight:700;
    color:#2d3436;
}

h1{
    color:#2d3436;
    font-size:34px;
    margin-bottom:8px;
}

.subtitle{
    color:#636e72;
    margin-bottom:22px;
}

.mode-buttons,
.difficulty-buttons{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
}

.mode-btn,
.diff-btn{
    border:none;
    padding:11px 18px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    background:#f1f2f6;
    color:#2d3436;
    transition:.2s;
}

.mode-btn:hover,
.diff-btn:hover{
    transform:translateY(-2px);
}

.mode-btn.active,
.diff-btn.active{
    background:#6c5ce7;
    color:white;
    box-shadow:0 6px 15px rgba(108,92,231,.3);
}

.section-title{
    margin:18px 0 9px;
    font-size:13px;
    color:#636e72;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:1px;
}

.scoreboard{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin:22px 0;
}

.score-card{
    padding:14px 8px;
    border-radius:16px;
    background:#f8f8ff;
}

.score-card .symbol{
    font-size:24px;
    font-weight:bold;
}

.score-card .score{
    display:block;
    font-size:25px;
    margin-top:5px;
    color:#2d3436;
}

.score-card.x .symbol{
    color:#0984e3;
}

.score-card.draw .symbol{
    color:#636e72;
}

.score-card.o .symbol{
    color:#e84393;
}

.status{
    min-height:30px;
    margin-bottom:14px;
    font-size:18px;
    font-weight:bold;
    color:#2d3436;
}

.status.win{
    color:#00a86b;
}

.status.loss{
    color:#e84393;
}

.status.draw{
    color:#636e72;
}

.board{
    width:min(100%,390px);
    aspect-ratio:1;
    margin:0 auto 22px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.cell{
    border:none;
    border-radius:20px;
    background:#f1f2f6;
    font-size:clamp(45px,12vw,70px);
    font-weight:800;
    color:#2d3436;
    cursor:pointer;
    box-shadow:inset 0 -5px 0 rgba(0,0,0,.05);
    transition:.18s;
}

.cell:hover:not(:disabled){
    transform:scale(.97);
    background:#e9e8ff;
}

.cell:disabled{
    cursor:default;
}

.cell.x{
    color:#0984e3;
}

.cell.o{
    color:#e84393;
}

.cell.winner{
    animation:winnerPulse .65s infinite alternate;
    background:#dff9eb;
}

@keyframes winnerPulse{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.06);
    }
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.action-btn{
    border:none;
    padding:14px;
    border-radius:14px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    transition:.2s;
}

.action-btn:hover{
    transform:translateY(-2px);
}

.new-game{
    background:#6c5ce7;
    color:white;
}

.reset{
    background:#f1f2f6;
    color:#2d3436;
}

.message{
    margin-top:18px;
    color:#636e72;
    font-size:13px;
}

footer{
    margin-top:18px;
    color:#999;
    font-size:12px;
}

@media(max-width:450px){
    body{
        padding:10px;
    }

    .game{
        padding:20px 15px;
        border-radius:22px;
    }

    h1{
        font-size:28px;
    }

    .board{
        gap:7px;
    }

    .cell{
        border-radius:15px;
    }

    .mode-btn,
    .diff-btn{
        padding:10px 13px;
        font-size:13px;
    }
}

@media(max-width:340px){
    .actions{
        grid-template-columns:1fr;
    }

    .brand-name{
        font-size:17px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="brand">
        <div class="logo">SK</div>
        <div class="brand-name">Sandeep Kumar</div>
    </div>

    <h1>🎮 Tic Tac Toe</h1>
    <p class="subtitle">Classic Tic Tac Toe Game</p>

    <div class="section-title">Game Mode</div>

    <div class="mode-buttons">
        <button class="mode-btn active" id="computerMode">
            🤖 Computer
        </button>

        <button class="mode-btn" id="twoPlayerMode">
            👥 2 Players
        </button>
    </div>

    <div id="difficultySection">
        <div class="section-title">Difficulty</div>

        <div class="difficulty-buttons">
            <button class="diff-btn active" data-level="easy">
                Easy
            </button>

            <button class="diff-btn" data-level="medium">
                Medium
            </button>

            <button class="diff-btn" data-level="strong">
                Strong
            </button>
        </div>
    </div>

    <div class="scoreboard">

        <div class="score-card x">
            <div class="symbol">❌ X</div>
            <span class="score" id="xScore">0</span>
        </div>

        <div class="score-card draw">
            <div class="symbol">🤝 Draw</div>
            <span class="score" id="drawScore">0</span>
        </div>

        <div class="score-card o">
            <div class="symbol">⭕ O</div>
            <span class="score" id="oScore">0</span>
        </div>

    </div>

    <div class="status" id="status">
        Your turn
    </div>

    <div class="board">

        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>

        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>

        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>

    </div>

    <div class="actions">

        <button class="action-btn new-game" id="newGame">
            🔄 New Game
        </button>

        <button class="action-btn reset" id="resetScore">
            🗑️ Reset Score
        </button>

    </div>

    <div class="message" id="message">
        Click a square to start playing.
    </div>

    <footer>
        © 2026 Sandeep Kumar
    </footer>

</div>

<script>
const cells = document.querySelectorAll(".cell");

const statusText = document.getElementById("status");
const message = document.getElementById("message");

const xScoreElement = document.getElementById("xScore");
const oScoreElement = document.getElementById("oScore");
const drawScoreElement = document.getElementById("drawScore");

const computerModeButton = document.getElementById("computerMode");
const twoPlayerModeButton = document.getElementById("twoPlayerMode");

const difficultySection = document.getElementById("difficultySection");
const difficultyButtons = document.querySelectorAll(".diff-btn");

const newGameButton = document.getElementById("newGame");
const resetScoreButton = document.getElementById("resetScore");

let board = ["","","","","","","","",""];

let currentPlayer = "X";
let gameOver = false;
let computerThinking = false;

let computerMode = true;
let difficultyLevel = "easy";

let scores = {
    X: 0,
    O: 0,
    draw: 0
};

const winningCombinations = [
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6]
];

function updateBoard(){

    cells.forEach((cell,index)=>{

        cell.textContent = board[index];

        cell.classList.remove("x","o");

        if(board[index] === "X"){
            cell.classList.add("x");
        }

        if(board[index] === "O"){
            cell.classList.add("o");
        }

        cell.disabled =
            board[index] !== "" ||
            gameOver ||
            computerThinking;

    });
}

function updateScores(){

    xScoreElement.textContent = scores.X;
    oScoreElement.textContent = scores.O;
    drawScoreElement.textContent = scores.draw;

}

function setStatus(text,type=""){

    statusText.textContent = text;

    statusText.className = "status";

    if(type){
        statusText.classList.add(type);
    }

}

function makeMove(index){

    if(
        gameOver ||
        board[index] !== "" ||
        computerThinking
    ){
        return;
    }

    board[index] = currentPlayer;

    updateBoard();

    checkGame();

}

function checkGame(){

    const winningLine = getWinningLine();

    if(winningLine){

        gameOver = true;

        const winner = board[winningLine[0]];

        scores[winner]++;

        updateScores();

        highlightWinner(winningLine);

        setStatus(
            `🎉 ${winner} Wins!`,
            winner === "X" ? "win" : "loss"
        );

        message.textContent =
            `${winner} won the game!`;

        updateBoard();

        return;
    }

    if(!board.includes("")){

        gameOver = true;

        scores.draw++;

        updateScores();

        setStatus("🤝 Draw!","draw");

        message.textContent =
            "The game is a draw!";

        updateBoard();

        return;
    }

    currentPlayer =
        currentPlayer === "X" ? "O" : "X";

    if(computerMode && currentPlayer === "O"){

        setStatus("🤖 Computer is thinking...");

        computerThinking = true;

        updateBoard();

        setTimeout(computerMove,450);

    }else{

        if(currentPlayer === "X"){
            setStatus("❌ Your turn");
        }else{
            setStatus("⭕ Player O's turn");
        }

        updateBoard();
    }
}

function getWinningLine(){

    for(const combination of winningCombinations){

        const [a,b,c] = combination;

        if(
            board[a] &&
            board[a] === board[b] &&
            board[a] === board[c]
        ){

            return combination;

        }
    }

    return null;
}

function highlightWinner(line){

    line.forEach(index=>{
        cells[index].classList.add("winner");
    });

}

function computerMove(){

    if(gameOver){
        return;
    }

    let move;

    if(difficultyLevel === "easy"){
        move = randomMove();
    }

    if(difficultyLevel === "medium"){
        move = mediumMove();
    }

    if(difficultyLevel === "strong"){
        move = bestMove();
    }

    if(move !== undefined && move !== null){

        board[move] = "O";

    }

    computerThinking = false;

    updateBoard();

    checkGame();

}

function getEmptyCells(){

    return board
        .map((value,index)=>value === "" ? index : null)
        .filter(index=>index !== null);

}

function randomMove(){

    const empty = getEmptyCells();

    if(empty.length === 0){
        return null;
    }

    return empty[
        Math.floor(Math.random() * empty.length)
    ];

}

function mediumMove(){

    const empty = getEmptyCells();

    if(empty.length === 0){
        return null;
    }

    // Computer can win
    for(const index of empty){

        board[index] = "O";

        if(getWinningLine()){

            board[index] = "";

            return index;
        }

        board[index] = "";
    }

    // Block player
    for(const index of empty){

        board[index] = "X";

        if(getWinningLine()){

            board[index] = "";

            return index;
        }

        board[index] = "";
    }

    // Center
    if(board[4] === ""){
        return 4;
    }

    // Corners
    const corners = [0,2,6,8]
        .filter(index=>board[index] === "");

    if(corners.length){

        return corners[
            Math.floor(Math.random() * corners.length)
        ];

    }

    return randomMove();

}

function bestMove(){

    let bestScore = -Infinity;
    let move;

    for(let index=0;index<9;index++){

        if(board[index] === ""){

            board[index] = "O";

            const score = minimax(board,false);

            board[index] = "";

            if(score > bestScore){

                bestScore = score;
                move = index;

            }
        }
    }

    return move;
}

function minimax(position,isMaximizing){

    const winner = getWinnerForMinimax(position);

    if(winner === "O"){
        return 10;
    }

    if(winner === "X"){
        return -10;
    }

    if(!position.includes("")){
        return 0;
    }

    if(isMaximizing){

        let bestScore = -Infinity;

        for(let index=0;index<9;index++){

            if(position[index] === ""){

                position[index] = "O";

                const score =
                    minimax(position,false);

                position[index] = "";

                bestScore =
                    Math.max(bestScore,score);

            }
        }

        return bestScore;

    }else{

        let bestScore = Infinity;

        for(let index=0;index<9;index++){

            if(position[index] === ""){

                position[index] = "X";

                const score =
                    minimax(position,true);

                position[index] = "";

                bestScore =
                    Math.min(bestScore,score);

            }
        }

        return bestScore;
    }
}

function getWinnerForMinimax(position){

    for(const combination of winningCombinations){

        const [a,b,c] = combination;

        if(
            position[a] &&
            position[a] === position[b] &&
            position[a] === position[c]
        ){

            return position[a];

        }
    }

    return null;
}

function newGame(){

    board = [
        "","","",
        "","","",
        "","",""
    ];

    currentPlayer = "X";

    gameOver = false;

    computerThinking = false;

    cells.forEach(cell=>{
        cell.classList.remove("winner");
    });

    setStatus(
        computerMode
            ? "❌ Your turn"
            : "❌ Player X's turn"
    );

    message.textContent =
        "Click a square to start playing.";

    updateBoard();

}

function resetScore(){

    scores.X = 0;
    scores.O = 0;
    scores.draw = 0;

    updateScores();

    newGame();

    message.textContent =
        "Score has been reset.";

}

cells.forEach(cell=>{

    cell.addEventListener("click",()=>{

        const index =
            Number(cell.dataset.index);

        makeMove(index);

    });

});

computerModeButton.addEventListener("click",()=>{

    computerMode = true;

    computerModeButton.classList.add("active");
    twoPlayerModeButton.classList.remove("active");

    difficultySection.style.display = "block";

    newGame();

});

twoPlayerModeButton.addEventListener("click",()=>{

    computerMode = false;

    twoPlayerModeButton.classList.add("active");
    computerModeButton.classList.remove("active");

    difficultySection.style.display = "none";

    newGame();

});

difficultyButtons.forEach(button=>{

    button.addEventListener("click",()=>{

        difficultyButtons.forEach(btn=>{
            btn.classList.remove("active");
        });

        button.classList.add("active");

        difficultyLevel =
            button.dataset.level;

        newGame();

    });

});

newGameButton.addEventListener(
    "click",
    newGame
);

resetScoreButton.addEventListener(
    "click",
    resetScore
);

newGame();
</script>

</body>
</html>
